name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run mypy
      - run: uv run black --check src scripts tests
