[project]
name = "event-aware-traffic-prediction"
version = "0.1.0"
description = "BSc thesis: improving ML traffic prediction by incorporating planned-event data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    # Paired significance tests + bootstrap for the A->A+ evaluation (pipeline.evaluate).
    "scipy>=1.11",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    # GPU-capable gradient boosting (model.type = xgboost). CPU wheel works everywhere;
    # uses the GPU automatically via device="cuda" when one is available.
    "xgboost>=2.0",
    # Load API keys from a .env file (src/config.py).
    "python-dotenv>=1.0",
    # Fetch the raw PeMS data from the published Google Drive folder (src/data/build_real.py).
    "gdown>=5.1",
    "scipy-stubs~=1.18.0",
]

[project.optional-dependencies]
# Fetching real events (setlist.fm historical API + Ticketmaster Discovery API)
scrape = ["requests>=2.31"]
# Alternative gradient-boosting backend
boosting = ["lightgbm>=4.0"]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# Third-party libs that ship no type information.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "matplotlib.*", "xgboost.*", "scipy.*", "gdown.*"]
ignore_missing_imports = true

